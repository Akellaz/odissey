<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Барабанная секвенция</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/drum-library.css') }}">
</head>
<body>
    <div style="padding: 20px;">
        <h1>Барабанная секвенция</h1>
        
        <div class="drum-container">
            <div class="drum-controls">
                <div class="control-group">
                    <input type="text" id="patternName" placeholder="Имя паттерна" value="default">
                    <button onclick="savePattern()">Сохранить</button>
                    <button onclick="loadPattern()">Загрузить</button>
                    <button onclick="clearPattern()">Очистить</button>
                </div>
                
                <div class="control-group">
                    <button onclick="playPattern()" id="playButton">Проиграть</button>
                    <input type="range" id="bpm" min="40" max="240" value="120">
                    <span>BPM: <span id="bpmValue">120</span></span>
                </div>
            </div>

            <div class="drum-grid" id="drumGrid"></div>
            
            <div class="pattern-list">
                <h3>Сохраненные паттерны:</h3>
                <select id="patternSelect" onchange="loadSelectedPattern()">
                    <option value="">Выберите паттерн...</option>
                </select>
                <button onclick="refreshPatternList()">Обновить список</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/drum-library.js') }}"></script>
</body>
</html>
